name: openagents-evaluation
x-backend: &backend-image "${OA_BACKEND_IMAGE:-openagents-evaluation/runtime-backend:07fc980bd083}"
services:
  db:
    image: openagents-evaluation/runtime-postgres:a3c40a6a77a9
    restart: unless-stopped
    environment:
      POSTGRES_USER: openagents
      POSTGRES_DB: openagents
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagents -d openagents"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    image: *backend-image
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/deploy/backend.sh"]
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "1"
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "4"
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      CLOUD_PROVIDERS_DIR: /deploy/catalog
      FILE_STORAGE_PATH: /srv/openagents-files
      YUMI_ENABLED: "true"
      ROUTER_LLM_ENABLED: "true"
      YUMI_MODEL: deepseek-flash
      ROUTER_LLM_MODEL: deepseek-flash
      YUMI_MAX_TOKENS: "0"
      YUMI_BASE_URL: https://api.deepseek.com/v1
      ROUTER_LLM_BASE_URL: https://api.deepseek.com/v1
      ROUTER_LLM_PROVIDER: openai
      FRONTEND_BASE_URL: http://openagents.localhost:${OPENAGENTS_PORT:-18811}
    secrets: [postgres-password, deepseek-key]
    volumes:
      - files:/srv/openagents-files
      - ./runtime/backend.sh:/deploy/backend.sh:ro
      - ./runtime/catalog:/deploy/catalog:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/cloud-agents/providers', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 60
  web:
    image: "${OA_WEB_IMAGE:-openagents-evaluation/runtime-web:64da819240b1}"
    restart: unless-stopped
    environment:
      WORKSPACE_DEV_API_TARGET: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
  bootstrap:
    image: *backend-image
    restart: "no"
    depends_on:
      backend: {condition: service_healthy}
    entrypoint: ["python", "/deploy/bootstrap.py"]
    secrets: [deepseek-key, login-password, postgres-password]
    volumes:
      - ./runtime/bootstrap.py:/deploy/bootstrap.py:ro
      - provision:/state
      - entry:/entry
  front:
    image: openagents-evaluation/runtime-nginx:62d1c420c34a
    restart: unless-stopped
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      web: {condition: service_started}
    ports:
      - "${OPENAGENTS_BIND:-127.0.0.1}:${OPENAGENTS_PORT:-18811}:80"
    volumes:
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - entry:/etc/nginx/entry:ro
secrets:
  postgres-password: {file: "${OPENAGENTS_CONFIG:?Run manage.py first}/postgres-password"}
  deepseek-key: {file: "${OPENAGENTS_CONFIG:?Run manage.py first}/deepseek-key"}
  login-password: {file: "${OPENAGENTS_CONFIG:?Run manage.py first}/login-password"}
volumes:
  postgres-data:
  files:
  provision:
  entry:
