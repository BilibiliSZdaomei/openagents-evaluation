log_format workspace_safe '$remote_addr $request_method $uri $status';
map $http_authorization $upstream_auth { "~*^Basic " ""; default $http_authorization; }
server {
    listen 80;
    access_log /var/log/nginx/access.log workspace_safe;
    client_max_body_size 32m;
    add_header Referrer-Policy no-referrer always;
    location = / { return 302 /start/workspace; }
    location = /start/workspace {
        auth_basic "OpenAgents evaluation";
        auth_basic_user_file /etc/nginx/entry/passwords;
        alias /etc/nginx/entry/index.html;
        default_type text/html;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        limit_except GET { deny all; }
    }
    location /wsapi/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $upstream_auth;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $upstream_auth;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
